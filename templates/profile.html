{% extends "base.html" %}

{% block title %}My Profile - Haiti National Bank{% endblock %}

{% block content %}
<h1 style="color: var(--haiti-blue); margin-bottom: 2rem;">My Profile</h1>

<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">Personal Information</div>

    <form method="POST" action="{{ url_for('update_profile') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" value="{{ current_user.username }}" disabled>
            <small style="color: #6c757d;">Username cannot be changed</small>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email }}" required>
        </div>

        <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ current_user.first_name }}" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ current_user.last_name }}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" value="{{ current_user.phone or '' }}">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ current_user.address or '' }}">
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" class="form-control" id="city" name="city" value="{{ current_user.city or 'Port-au-Prince' }}">
        </div>

        <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 1rem; color: #6c757d;">
            <p><strong>Member since:</strong> {{ current_user.created_at.strftime('%B %d, %Y') }}</p>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Update Profile</button>
    </form>

    <div class="text-center mt-2">
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
