# Deploy Calendar Application
name: Deploy Calendar App

# Controls when the workflow will run
on:
  # Triggers the workflow on push to main branch
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs
jobs:
  # Build and deploy job
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v4
      
      # Set up Node.js environment (assuming calendar app uses Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # Install dependencies (if package.json exists)
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
      
      # Build the application (if build script exists)
      - name: Build application
        run: |
          if [ -f package.json ] && npm run build --if-present; then
            echo "Build completed"
          else
            echo "No build script found or build not needed"
          fi
      
      # Run tests (if test script exists)
      - name: Run tests
        run: |
          if [ -f package.json ] && npm test --if-present; then
            echo "Tests completed"
          else
            echo "No tests found, skipping"
          fi
      
      # Deploy to GitHub Pages (if static site)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      
      # Deployment success notification
      - name: Deployment Status
        run: |
          echo "🚀 Calendar application deployment completed!"
          echo "📅 Deployed from commit: ${{ github.sha }}"
          echo "🌟 Ready for production use"
